[package]
name = "oxideav-h263-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# The fuzz sub-crate is its own workspace (kept out of the umbrella
# workspace; resolves oxideav-core from crates.io like consumers do).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
oxideav-core = "0.1"

[dependencies.oxideav-h263]
path = ".."

[[bin]]
name = "decode_sequence"
path = "fuzz_targets/decode_sequence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "registry_decoder"
path = "fuzz_targets/registry_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "psupp"
path = "fuzz_targets/psupp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "picture_header"
path = "fuzz_targets/picture_header.rs"
test = false
doc = false
bench = false
